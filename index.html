<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloblist</title>
<style>
  :root {
    --bg-grad-1: #FFE5EC; --bg-grad-2: #C9E4FF; --bg-grad-3: #FFF4D6;
    --orb-1: #FFB3C6; --orb-2: #A4C8FF; --orb-3: #FFD6A5;
    --ink: #2D2640; --ink-2: #6B6386; --ink-3: #9590A8;
    --glass-bg: rgba(255,255,255,0.55); --glass-bg-strong: rgba(255,255,255,0.75);
    --glass-border: rgba(255,255,255,0.6); --glass-shadow: rgba(45,38,64,0.08);
    --accent: #6B5BD6; --accent-soft: rgba(107,91,214,0.12);
    --pink: #FF6B9D; --pink-soft: rgba(255,107,157,0.12);
    --green: #34C77B; --green-soft: rgba(52,199,123,0.12);
    --orange: #FF8A3D; --orange-soft: rgba(255,138,61,0.12);
    --danger: #E64545; --danger-soft: rgba(230,69,69,0.12);
    --gold: #E5A82E; --gold-soft: rgba(229,168,46,0.15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-grad-1: #1F1A2E; --bg-grad-2: #2A2444; --bg-grad-3: #1A1F3A;
      --orb-1: #6B4FA8; --orb-2: #4A6FA8; --orb-3: #A86B6B;
      --ink: #F0EDFF; --ink-2: #B5B0CC; --ink-3: #7A7595;
      --glass-bg: rgba(40,35,60,0.5); --glass-bg-strong: rgba(40,35,60,0.75);
      --glass-border: rgba(255,255,255,0.1);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 50%, var(--bg-grad-3) 100%); background-attachment: fixed; overflow-x: hidden; position: relative; }
  body::before, body::after { content: ''; position: fixed; border-radius: 50%; filter: blur(60px); opacity: 0.5; z-index: 0; pointer-events: none; will-change: transform; }
  body::before { width: 380px; height: 380px; background: var(--orb-1); top: -100px; left: -100px; animation: float1 60s ease-in-out infinite; }
  body::after { width: 320px; height: 320px; background: var(--orb-2); bottom: -80px; right: -80px; animation: float2 75s ease-in-out infinite; }
  .orb-3 { display: none; }
  @keyframes float1 { 0%,100%{transform:translate(0,0);} 33%{transform:translate(50px,80px);} 66%{transform:translate(-30px,50px);} }
  @keyframes float2 { 0%,100%{transform:translate(0,0);} 50%{transform:translate(-80px,-50px);} }
  @keyframes float3 { 0%,100%{transform:translate(0,0);} 50%{transform:translate(-100px,80px);} }
  .app { max-width: 720px; margin: 0 auto; padding: 1.5rem 1.25rem 5rem; position: relative; z-index: 1; }
  .glass { background: var(--glass-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 0.5px solid var(--glass-border); border-radius: 24px; box-shadow: 0 8px 32px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.4); }
  .blob-house { padding: 1.25rem; margin-bottom: 1rem; }
  .house-inner { display: flex; align-items: center; gap: 14px; }
  .blob-stage { width: 80px; height: 80px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; background: var(--glass-bg-strong); border-radius: 50%; border: 0.5px solid var(--glass-border); box-shadow: inset 0 2px 8px rgba(255,255,255,0.5), 0 4px 12px var(--glass-shadow); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); position: relative; }
  .blob-stage:hover { transform: scale(1.05); }
  .blob-stage:active { transform: scale(0.95); }
  .blob-svg { width: 75%; height: 75%; }
  .blob-info { flex: 1; min-width: 0; }
  .blob-name-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .blob-name { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
  .pill-info { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 0.5px solid transparent; }
  .pill-streak { background: var(--orange-soft); color: var(--orange); border-color: rgba(255,138,61,0.2); }
  .pill-streak.zero { opacity: 0.4; }
  .pill-coins { background: var(--gold-soft); color: var(--gold); border-color: rgba(229,168,46,0.25); }
  .pill-hp { background: var(--danger-soft); color: var(--danger); border-color: rgba(230,69,69,0.2); }
  .pill-hp.full { background: var(--green-soft); color: var(--green); border-color: rgba(52,199,123,0.2); }
  .blob-mood { font-size: 12px; color: var(--ink-2); min-height: 18px; font-style: italic; }
  .level-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .level-bar { flex: 1; height: 5px; background: rgba(255,255,255,0.4); border-radius: 999px; overflow: hidden; border: 0.5px solid var(--glass-border); }
  .level-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--pink)); transition: width 0.8s cubic-bezier(0.34,1.56,0.64,1); border-radius: 999px; }
  .level-text { font-size: 10px; color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }
  .tabs { display: flex; gap: 3px; margin-bottom: 1rem; background: var(--glass-bg); backdrop-filter: blur(10px); border: 0.5px solid var(--glass-border); border-radius: 14px; padding: 4px; box-shadow: 0 4px 16px var(--glass-shadow); overflow-x: auto; }
  .tab { flex: 1; padding: 8px 6px; border: none; background: transparent; border-radius: 10px; font-family: inherit; font-size: 12px; font-weight: 500; color: var(--ink-2); cursor: pointer; transition: all 0.2s; white-space: nowrap; min-width: fit-content; }
  .tab.active { background: var(--glass-bg-strong); color: var(--ink); font-weight: 600; }
  .capture { display: flex; gap: 8px; margin-bottom: 0.75rem; }
  .capture input { flex: 1; padding: 12px 16px; border: 0.5px solid var(--glass-border); border-radius: 14px; background: var(--glass-bg); backdrop-filter: blur(10px); color: var(--ink); font-family: inherit; font-size: 14px; outline: none; box-shadow: 0 4px 16px var(--glass-shadow); }
  .capture input:focus { border-color: var(--accent); }
  .capture input::placeholder { color: var(--ink-3); }
  .quick-row { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
  .btn { padding: 12px 18px; border-radius: 14px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border: 0.5px solid var(--glass-border); box-shadow: 0 4px 16px var(--glass-shadow); transition: all 0.2s; backdrop-filter: blur(10px); }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--accent); color: white; border-color: transparent; }
  .btn-secondary { background: var(--glass-bg-strong); color: var(--ink); }
  .btn-success { background: var(--green); color: white; border-color: transparent; }
  .btn-pink { background: var(--pink); color: white; border-color: transparent; }
  .btn-small { padding: 8px 14px; font-size: 12px; border-radius: 10px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
  .chip { padding: 5px 12px; border-radius: 999px; border: 0.5px solid var(--glass-border); background: var(--glass-bg); backdrop-filter: blur(10px); font-family: inherit; font-size: 11px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
  .chip.active { background: var(--ink); color: white; border-color: transparent; }
  .task { background: var(--glass-bg); backdrop-filter: blur(10px); border: 0.5px solid var(--glass-border); border-radius: 16px; padding: 14px 16px; margin-bottom: 8px; box-shadow: 0 4px 16px var(--glass-shadow); transition: all 0.25s; position: relative; overflow: hidden; }
  .task:hover { transform: translateY(-2px); }
  .task.done { opacity: 0.55; }
  .task.completing { animation: completePulse 0.7s ease-out; }
  @keyframes completePulse { 0%{transform:scale(1);} 40%{transform:scale(1.02); background:var(--green-soft);} 100%{transform:scale(1);} }
  .task-main { display: flex; align-items: flex-start; gap: 12px; }
  .check-btn { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--ink-3); background: transparent; cursor: pointer; flex-shrink: 0; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; transition: all 0.2s; margin-top: 1px; }
  .check-btn:hover { border-color: var(--accent); transform: scale(1.1); }
  .check-btn.checked { background: var(--green); color: white; border-color: var(--green); }
  .task-content { flex: 1; min-width: 0; }
  .task-title { font-size: 14px; font-weight: 500; line-height: 1.4; cursor: pointer; }
  .task.done .task-title { text-decoration: line-through; color: var(--ink-2); }
  .deadline { font-size: 10px; font-weight: 500; margin-top: 4px; display: inline-block; padding: 2px 8px; border-radius: 5px; background: var(--accent-soft); color: var(--ink-2); }
  .deadline.urgent { background: var(--danger-soft); color: var(--danger); font-weight: 600; }
  .meta { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .tag { font-size: 10px; padding: 2px 8px; border-radius: 5px; font-weight: 500; }
  .tag-today { background: var(--danger-soft); color: var(--danger); }
  .tag-week { background: var(--orange-soft); color: var(--orange); }
  .tag-someday { background: var(--accent-soft); color: var(--ink-2); }
  .tag-work { background: var(--accent-soft); color: var(--accent); }
  .tag-personal { background: var(--pink-soft); color: var(--pink); }
  .tag-quick { background: var(--green-soft); color: var(--green); }
  .tag-deep { background: var(--accent-soft); color: var(--accent); }
  .tag-errand { background: var(--orange-soft); color: var(--orange); }
  .tag-quest { background: var(--gold-soft); color: var(--gold); border: 0.5px solid rgba(229,168,46,0.3); }
  .tag-recurring { background: rgba(107,91,214,0.12); color: var(--accent); border: 0.5px solid rgba(107,91,214,0.25); }
  .actions { display: flex; gap: 2px; margin-left: auto; opacity: 0.4; }
  .task:hover .actions { opacity: 1; }
  .icon-btn { background: transparent; border: none; padding: 4px 6px; cursor: pointer; color: var(--ink-3); border-radius: 6px; font-size: 13px; font-family: inherit; }
  .icon-btn:hover { background: var(--accent-soft); color: var(--ink); }
  .subtasks { margin-top: 10px; padding: 10px 12px; background: rgba(255,255,255,0.3); border: 0.5px solid var(--glass-border); border-radius: 12px; }
  .subtask { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; }
  .subtask.done { opacity: 0.5; text-decoration: line-through; }
  .sub-check { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--ink-3); background: transparent; cursor: pointer; flex-shrink: 0; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; }
  .sub-check.checked { background: var(--green); border-color: var(--green); color: white; }
  .add-sub { font-size: 11px; color: var(--ink-3); background: none; border: none; padding: 3px 0; cursor: pointer; font-family: inherit; font-weight: 500; }
  .sub-progress { height: 3px; background: rgba(255,255,255,0.3); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .sub-progress-fill { height: 100%; background: var(--green); transition: width 0.5s cubic-bezier(0.34,1.56,0.64,1); }
  .sub-counter { font-size: 10px; color: var(--ink-3); margin-top: 4px; font-weight: 500; }
  .notes { margin-top: 10px; padding: 8px 12px; background: rgba(255,255,255,0.3); border-left: 2px solid var(--accent); border-radius: 6px; font-size: 12px; color: var(--ink-2); white-space: pre-wrap; }
  .task-actions-row { margin-top: 10px; display: flex; gap: 5px; flex-wrap: wrap; }
  .mini-btn { padding: 5px 10px; border: 0.5px solid var(--glass-border); border-radius: 8px; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer; background: var(--glass-bg-strong); color: var(--ink); }
  .mini-btn-magic { background: var(--accent-soft); color: var(--accent); }
  .mini-btn-timer { background: var(--green-soft); color: var(--green); }
  .mini-btn-quick { background: var(--pink-soft); color: var(--pink); }
  .empty { text-align: center; padding: 2rem 1rem; color: var(--ink-2); }
  .empty-blob { width: 80px; height: 80px; margin: 0 auto 1rem; opacity: 0.5; }
  .empty-text { font-style: italic; font-size: 13px; }
  .now-card { padding: 2rem 1.5rem; text-align: center; }
  .now-label { font-size: 10px; font-weight: 600; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; margin-bottom: 1rem; }
  .now-title { font-size: 20px; font-weight: 600; margin-bottom: 1rem; line-height: 1.3; }
  .now-meta { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; margin-bottom: 1rem; }
  .now-step { background: var(--accent-soft); border: 0.5px solid rgba(107,91,214,0.2); border-radius: 12px; padding: 12px; margin: 1rem 0; }
  .now-step-label { font-size: 9px; font-weight: 700; color: var(--accent); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 4px; }
  .now-step-text { font-size: 14px; font-weight: 500; }
  .now-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 1.25rem; }
  .modal-bg { position: fixed; inset: 0; background: rgba(45,38,64,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; animation: fadeIn 0.2s; }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  .modal { background: var(--glass-bg-strong); backdrop-filter: blur(16px); border: 0.5px solid var(--glass-border); border-radius: 22px; padding: 1.5rem; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(45,38,64,0.2); animation: pop 0.3s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes pop { from{transform:scale(0.92) translateY(20px); opacity:0;} to{transform:scale(1) translateY(0); opacity:1;} }
  .modal h3 { margin: 0 0 1rem; font-size: 17px; font-weight: 600; }
  .field { margin-bottom: 14px; }
  .field-label { font-size: 10px; color: var(--ink-2); margin-bottom: 5px; display: block; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
  .field input, .field textarea, .field select { width: 100%; padding: 10px 14px; border: 0.5px solid var(--glass-border); border-radius: 11px; font-family: inherit; font-size: 13px; background: rgba(255,255,255,0.5); color: var(--ink); outline: none; }
  .pill-group { display: flex; gap: 5px; flex-wrap: wrap; }
  .pill { padding: 6px 12px; border-radius: 999px; border: 0.5px solid var(--glass-border); background: rgba(255,255,255,0.4); font-family: inherit; font-size: 11px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
  .pill.active { background: var(--accent); color: white; border-color: transparent; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.25rem; flex-wrap: wrap; }
  .timer-overlay { position: fixed; inset: 0; background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 50%, var(--bg-grad-3) 100%); display: flex; align-items: center; justify-content: center; z-index: 200; flex-direction: column; gap: 1.25rem; padding: 1.5rem; animation: fadeIn 0.3s; }
  .timer-card { padding: 1.5rem; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .timer-blob { width: 90px; height: 90px; }
  .timer-blob svg { width: 100%; height: 100%; animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
  .timer-task { font-size: 15px; color: var(--ink-2); text-align: center; max-width: 380px; font-weight: 500; }
  .timer-display { font-size: 80px; font-weight: 200; letter-spacing: -2px; font-variant-numeric: tabular-nums; color: var(--ink); line-height: 1; }
  .timer-ring { position: relative; width: 260px; height: 260px; }
  .timer-ring svg { transform: rotate(-90deg); }
  .timer-status { font-size: 10px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }
  .body-double-msg { background: rgba(255,255,255,0.3); padding: 12px 16px; border-radius: 12px; font-size: 12px; color: var(--ink-2); font-style: italic; max-width: 360px; text-align: center; min-height: 38px; transition: opacity 0.4s; }
  .confetti { position: fixed; pointer-events: none; inset: 0; overflow: hidden; z-index: 300; }
  .confetti-piece { position: absolute; font-size: 22px; animation: tumble 2s ease-out forwards; }
  @keyframes tumble { 0%{transform:translateY(-20vh) rotate(0deg) scale(0); opacity:1;} 20%{transform:translateY(0) rotate(180deg) scale(1.2);} 100%{transform:translateY(120vh) rotate(720deg) scale(1); opacity:0;} }
  .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: var(--glass-bg-strong); backdrop-filter: blur(10px); border: 0.5px solid var(--glass-border); color: var(--ink); border-radius: 16px; padding: 12px 20px; font-size: 13px; font-weight: 500; z-index: 250; max-width: 90%; box-shadow: 0 8px 32px var(--glass-shadow); animation: bubbleIn 0.3s cubic-bezier(0.34,1.56,0.64,1), bubbleOut 0.3s ease-in 2.7s forwards; }
  @keyframes bubbleIn { from{transform:translateX(-50%) translateY(30px) scale(0.9); opacity:0;} to{transform:translateX(-50%) translateY(0) scale(1); opacity:1;} }
  @keyframes bubbleOut { from{opacity:1;} to{transform:translateX(-50%) translateY(20px); opacity:0;} }
  .loot-popup { position: fixed; bottom: 6rem; left: 50%; transform: translateX(-50%); z-index: 280; background: linear-gradient(135deg, var(--gold), var(--orange)); color: white; padding: 14px 22px; border-radius: 16px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 32px rgba(229,168,46,0.4); animation: lootIn 0.4s cubic-bezier(0.34,1.56,0.64,1), lootOut 0.4s ease-in 2.6s forwards; }
  @keyframes lootIn { from{transform:translateX(-50%) translateY(40px) scale(0.5); opacity:0;} to{transform:translateX(-50%) translateY(0) scale(1); opacity:1;} }
  @keyframes lootOut { from{opacity:1;} to{transform:translateX(-50%) translateY(-20px); opacity:0;} }
  .collection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-top: 0.75rem; }
  .blob-card { background: var(--glass-bg); backdrop-filter: blur(10px); border: 0.5px solid var(--glass-border); border-radius: 16px; padding: 12px; box-shadow: 0 4px 16px var(--glass-shadow); text-align: center; cursor: pointer; transition: all 0.2s; }
  .blob-card:hover { transform: translateY(-2px); }
  .blob-card.locked { opacity: 0.4; }
  .blob-card.active { border-color: var(--accent); box-shadow: 0 4px 20px var(--accent-soft); }
  .blob-card svg { width: 60px; height: 60px; }
  .blob-card-name { font-size: 12px; font-weight: 600; margin-top: 6px; }
  .blob-card-req { font-size: 10px; color: var(--ink-3); margin-top: 2px; font-weight: 500; }
  .footer-row { margin-top: 1.5rem; padding-top: 1rem; border-top: 0.5px solid var(--glass-border); display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px; }
  .link-btn { background: none; border: none; color: var(--ink-2); font-family: inherit; font-size: 11px; cursor: pointer; padding: 4px 10px; font-weight: 500; border-radius: 8px; }
  .link-btn:hover { background: var(--accent-soft); color: var(--ink); }
  .map-area { padding: 1rem; }
  .map-svg { width: 100%; height: auto; display: block; max-width: 500px; margin: 0 auto; aspect-ratio: 1/1; }
  .map-region { cursor: pointer; transition: all 0.3s; }
  .map-info { padding: 14px; background: var(--glass-bg-strong); border: 0.5px solid var(--glass-border); border-radius: 14px; margin-top: 0.75rem; text-align: center; font-size: 13px; }
  .map-region-name { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
  .map-region-desc { color: var(--ink-2); font-size: 12px; font-style: italic; }
  .quest-card { background: var(--glass-bg); backdrop-filter: blur(10px); border: 0.5px solid var(--glass-border); border-radius: 16px; padding: 14px 16px; margin-bottom: 8px; box-shadow: 0 4px 16px var(--glass-shadow); }
  .quest-card.complete { opacity: 0.6; }
  .quest-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .quest-emoji { font-size: 22px; }
  .quest-title { font-size: 15px; font-weight: 600; flex: 1; }
  .quest-progress-text { font-size: 11px; color: var(--ink-2); margin-top: 6px; }
  .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 0.75rem; }
  .shop-item { background: var(--glass-bg); backdrop-filter: blur(10px); border: 0.5px solid var(--glass-border); border-radius: 14px; padding: 14px 12px; text-align: center; cursor: pointer; transition: all 0.2s; }
  .shop-item:hover { transform: translateY(-2px); }
  .shop-item.owned { opacity: 0.7; }
  .shop-item.equipped { border-color: var(--accent); background: var(--accent-soft); }
  .shop-emoji { font-size: 32px; margin-bottom: 6px; }
  .shop-name { font-size: 12px; font-weight: 600; }
  .shop-cost { font-size: 11px; color: var(--gold); font-weight: 600; margin-top: 4px; }
  .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-2); margin: 1rem 0 0.5rem; padding: 0 4px; }
  .checkin { padding: 14px 16px; margin-bottom: 0.75rem; }
  .checkin-q { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .checkin-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .mood-btn { padding: 8px 12px; border-radius: 12px; border: 0.5px solid var(--glass-border); background: rgba(255,255,255,0.4); cursor: pointer; font-size: 18px; font-family: inherit; transition: all 0.2s; }

function pickMood(){
  const active=state.tasks.filter(t=>!t.done);

function load(){
  try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const d=JSON.parse(raw);state.tasks=d.tasks||[];state.quests=d.quests||[];}else{state.tasks=seedTasks;state.quests=[];save();}}catch{state.tasks=seedTasks;state.quests=[];save();}

function updateStreak(){
  const today=new Date().toISOString().slice(0,10),yest=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(meta.lastDoneDate&&meta.lastDoneDate!==today&&meta.lastDoneDate!==yest){meta.streak=0;saveMeta();}
}
function updateHP(){
  const today=new Date().toISOString().slice(0,10);
  if(meta.lastCheckDate!==today){
    if(meta.lastDoneDate!==today){
      const last=meta.lastDoneDate?new Date(meta.lastDoneDate):null;
      if(last){const days=Math.floor((new Date(today)-last)/86400000);if(days>=2)meta.hp=Math.max(20,meta.hp-10*(days-1));}
    }
    meta.lastCheckDate=today;saveMeta();
  }
}
function recordDone(task){
  const today=new Date().toISOString().slice(0,10),yest=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(meta.lastDoneDate!==today){
    if(meta.lastDoneDate===yest)meta.streak+=1;else meta.streak=1;
    meta.lastDoneDate=today;
  }
  meta.totalDone=(meta.totalDone||0)+1;
  meta.hp=Math.min(100,meta.hp+5);
  if(!meta.doneByDate)meta.doneByDate={};
  meta.doneByDate[today]=(meta.doneByDate[today]||0)+1;
  // Recurring task: spawn next instance
  if(task&&task.repeat&&task.repeat!=='none'){
    const days={daily:1,weekly:7,biweekly:14,monthly:30}[task.repeat]||0;
    if(days>0){
      const next=new Date(Date.now()+days*86400000).toISOString().slice(0,10);
      state.tasks.push({id:uid(),title:task.title,done:false,urgency:task.urgency,context:task.context,energy:task.energy,deadline:next,notes:task.notes,subtasks:(task.subtasks||[]).map(s=>({id:'s'+Date.now()+Math.random().toString(36).slice(2,4),text:s.text,done:false})),created:Date.now(),questId:task.questId,repeat:task.repeat});

    }
  }
  const baseCoins=task&&task.energy==='deep'?8:task&&task.energy==='errand'?4:5;
  const lootRoll=Math.random();
  let coinsEarned=baseCoins,lootMsg=`+${baseCoins} 🪙`;
  if(lootRoll<0.05){coinsEarned=baseCoins*5;lootMsg=`🎰 JACKPOT! +${coinsEarned} 🪙`;}
  else if(lootRoll<0.15){coinsEarned=baseCoins*2;lootMsg=`✨ Lucky! +${coinsEarned} 🪙`;}
  else if(lootRoll<0.25){coinsEarned=baseCoins+3;lootMsg=`💫 +${coinsEarned} 🪙 (+3 bonus)`;}
  meta.coins=(meta.coins||0)+coinsEarned;
  // Treasure chest spawn check (every 10 tasks)
  if(meta.totalDone%10===0&&meta.unlockedRegions.length>0){
    const region=meta.unlockedRegions[Math.floor(Math.random()*meta.unlockedRegions.length)];
    if(!meta.chests)meta.chests=[];
    meta.chests.push({id:'c'+Date.now(),region,opened:false});
    setTimeout(()=>toast(`💰 a chest appeared in ${REGIONS[region].name}!`),1500);
  }
  Object.keys(BLOBS).forEach(id=>{if(BLOBS[id].unlock<=meta.totalDone&&!meta.unlocked.includes(id)){meta.unlocked.push(id);setTimeout(()=>toast(`✨ unlocked blob: ${BLOBS[id].name}`),1200);}});
  Object.keys(REGIONS).forEach(id=>{if(REGIONS[id].unlock<=meta.totalDone&&!meta.unlockedRegions.includes(id)){meta.unlockedRegions.push(id);meta.currentRegion=id;setTimeout(()=>toast(`🌍 new region: ${REGIONS[id].name}!`),1800);}});
  saveMeta();save();
  return lootMsg;
}
function uid(){return 't'+Date.now()+Math.random().toString(36).slice(2,6);}
function daysUntil(d){if(!d)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(d)-t)/86400000);}
function fmtDeadline(d){if(!d)return null;const x=daysUntil(d);if(x<0)return{text:`${Math.abs(x)}d overdue`,urgent:true};if(x===0)return{text:'due today',urgent:true};if(x===1)return{text:'due tomorrow',urgent:true};if(x<=3)return{text:`${x}d left`,urgent:true};return{text:`${x}d left`,urgent:false};}
function getFiltered(){
  let t=state.tasks;
  if(state.view==='done')t=t.filter(x=>x.done);else t=t.filter(x=>!x.done);
  if(state.filter!=='all')t=t.filter(x=>x.urgency===state.filter||x.context===state.filter||x.energy===state.filter);
  const order={today:0,week:1,someday:2};
  return t.sort((a,b)=>((order[a.urgency]??3)-(order[b.urgency]??3))||a.created-b.created);
}
function pickNowTask(){
  const active=state.tasks.filter(t=>!t.done);if(active.length===0)return null;
  const order={today:0,week:1,someday:2};
  active.sort((a,b)=>{const u=(order[a.urgency]??3)-(order[b.urgency]??3);if(u!==0)return u;const da=a.deadline?new Date(a.deadline).getTime():Infinity;const db=b.deadline?new Date(b.deadline).getTime():Infinity;return(da-db)||(a.created-b.created);});
  return active[0];
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function openChest(chest){
  const rolls=[
    {chance:0.35,coins:30,msg:'a small pile of coins'},
    {chance:0.6,coins:75,msg:'a decent stash'},
    {chance:0.85,coins:150,msg:'a hefty haul!'},
    {chance:1.0,item:true,msg:'something shiny'}
  ];
  const r=Math.random();
  let result;
  for(const opt of rolls){if(r<opt.chance){result=opt;break;}}
  if(result.item){
    // Give a random unowned shop item
    const unowned=Object.keys(SHOP_ITEMS).filter(id=>!meta.ownedItems.includes(id));
    if(unowned.length){
      const pick=unowned[Math.floor(Math.random()*unowned.length)];
      meta.ownedItems.push(pick);
      lootPopup(`💰 chest: ${SHOP_ITEMS[pick].emoji} ${SHOP_ITEMS[pick].name}!`);
    }else{
      meta.coins+=200;lootPopup(`💰 chest: +200 🪙 (everything already owned)`);
    }
  }else{
    meta.coins+=result.coins;
    lootPopup(`💰 chest: ${result.msg} +${result.coins} 🪙`);
  }
  chest.opened=true;
  meta.chests=meta.chests.filter(c=>!c.opened);
  saveMeta();celebrate();render();
}

const FUSIONS={
  'goober+zorp':{name:'Glorp',color:'#FFE5A5',eyes:'wide',mouth:'smile',accessory:'antennae'},
  'smush+blarp':{name:'Smarp',color:'#E5BEC9',eyes:'starry',mouth:'smirk',accessory:'sparkles'},
  'glorm+nebula':{name:'Glorbula',color:'#A87BB0',eyes:'cosmic',mouth:'fang',accessory:'fire'},
  'uwu+goober':{name:'Uwuber',color:'#FFD0E0',eyes:'uwu',mouth:'smile',accessory:'bow'},
  'zorp+blarp':{name:'Zarp',color:'#B5C9F0',eyes:'wide',mouth:'tongue',accessory:'horn'}
};
let fusionSlots=[null,null];
function tryFusion(){
  if(!fusionSlots[0]||!fusionSlots[1]){toast('pick two blobs first');return;}
  if(fusionSlots[0]===fusionSlots[1]){toast('need two different blobs');return;}
  const k1=`${fusionSlots[0]}+${fusionSlots[1]}`,k2=`${fusionSlots[1]}+${fusionSlots[0]}`;
  const recipe=FUSIONS[k1]||FUSIONS[k2];
  if(!recipe){toast(`those don't combine. try other pairs.`);fusionSlots=[null,null];render();return;}
  const fusionId=k1 in FUSIONS?k1:k2;
  if(meta.fusedBlobs.includes(fusionId)){toast('already discovered this one');return;}
  if(meta.coins<50){toast('fusion costs 50 🪙');return;}
  meta.coins-=50;meta.fusedBlobs.push(fusionId);
  // Add to BLOBS dynamically and unlock
  BLOBS[fusionId]={name:recipe.name,unlock:0,color:recipe.color,eyes:recipe.eyes,mouth:recipe.mouth,accessory:recipe.accessory};
  meta.unlocked.push(fusionId);
  saveMeta();celebrate();
  lootPopup(`✨ DISCOVERED: ${recipe.name}!`);
  fusionSlots=[null,null];render();
}
// Re-add fused blobs on load
function rehydrateFusions(){
  (meta.fusedBlobs||[]).forEach(fid=>{
    const recipe=FUSIONS[fid];
    if(recipe&&!BLOBS[fid])BLOBS[fid]={name:recipe.name,unlock:0,color:recipe.color,eyes:recipe.eyes,mouth:recipe.mouth,accessory:recipe.accessory};
  });
}

async function requestNotifPermission(){
  if(!('Notification' in window)){toast("your browser doesn't support notifications");return;}
  if(Notification.permission==='granted'){toast('notifications already on ✓');return;}
  const r=await Notification.requestPermission();
  if(r==='granted'){toast('notifications enabled 🔔');checkDeadlineNotifs();}
  else toast('no worries, you can enable them later');
}
function checkDeadlineNotifs(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const today=new Date().toISOString().slice(0,10);
  if(meta.lastNotifDate===today)return;
  const due=state.tasks.filter(t=>!t.done&&t.deadline&&daysUntil(t.deadline)<=1);
  if(due.length>0){
    new Notification(`bloblist: ${due.length} task${due.length>1?'s':''} due soon`,{body:due.slice(0,3).map(t=>'• '+t.title).join('\n'),icon:'data:image/svg+xml;base64,'+btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#FF8FB8"/></svg>')});
    meta.lastNotifDate=today;saveMeta();
  }
}

function startTimer(task,minutes=25,isBodyDouble=false){
  timerState={task,total:minutes*60,remaining:minutes*60,paused:false,interval:null,isBodyDouble};
  if(isBodyDouble){
    bodyDoubleInterval=setInterval(()=>{const el=document.getElementById('body-double-msg');if(el){el.style.opacity='0';setTimeout(()=>{el.textContent=bodyDoubleMessages[Math.floor(Math.random()*bodyDoubleMessages.length)];el.style.opacity='1';},400);}},8000);
  }
  renderTimer();
  timerState.interval=setInterval(()=>{
    if(!timerState.paused){
      timerState.remaining--;
      if(timerState.remaining<=0){
        clearInterval(timerState.interval);
        if(bodyDoubleInterval){clearInterval(bodyDoubleInterval);bodyDoubleInterval=null;}
        timerState.remaining=0;renderTimer();celebrate();
        const reward=isBodyDouble?3:(minutes>=25?5:2);
        meta.coins=(meta.coins||0)+reward;saveMeta();
        toast(`time! +${reward} 🪙. take a break.`);return;
      }
      renderTimer();
    }
  },1000);
}
function renderTimer(){
  if(!timerState){document.getElementById('timer-mount').innerHTML='';return;}
  const{task,total,remaining,paused,isBodyDouble}=timerState;
  const mins=Math.floor(remaining/60),secs=remaining%60;
  const display=`${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  const pct=((total-remaining)/total)*100;
  const r=120,c=2*Math.PI*r,offset=c-(pct/100)*c;
  // If timer DOM doesn't exist yet, build it once
  if(!document.getElementById('timer-display-num')){
    document.getElementById('timer-mount').innerHTML=`<div class="timer-overlay"><div class="glass timer-card">
      <div class="timer-blob">${svgBlob(meta.currentBlob,'happy',getEquippedExtras())}</div>
      <div class="timer-status" id="timer-status-text">${paused?'paused':remaining===0?'done':isBodyDouble?'working together':'focusing'}</div>
      ${isBodyDouble?`<div class="body-double-msg" id="body-double-msg">${bodyDoubleMessages[0]}</div>`:`<div class="timer-task">${task?esc(task.title):'focus session'}</div>`}
      <div class="timer-ring"><svg width="260" height="260"><circle cx="130" cy="130" r="${r}" stroke="rgba(255,255,255,0.4)" stroke-width="6" fill="none"/><circle id="timer-progress-ring" cx="130" cy="130" r="${r}" stroke="url(#tg)" stroke-width="6" fill="none" stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round" style="transition:stroke-dashoffset 1s linear"/><defs><linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6B5BD6"/><stop offset="100%" stop-color="#FF6B9D"/></linearGradient></defs></svg><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;"><div class="timer-display" id="timer-display-num">${display}</div></div></div>
      <div style="display:flex;gap:10px;" id="timer-buttons">${remaining>0?`<button class="btn btn-secondary" id="t-pause">${paused?'resume':'pause'}</button>`:''}<button class="btn btn-primary" id="t-stop">${remaining===0?'nice':'stop'}</button></div>
    </div></div>`;
    const pause=document.getElementById('t-pause');if(pause)pause.onclick=()=>{timerState.paused=!timerState.paused;updateTimerUI();};
    document.getElementById('t-stop').onclick=stopTimer;
    return;
  }
  // Otherwise just update the changing parts
  updateTimerUI();
}
function updateTimerUI(){
  if(!timerState)return;
  const{total,remaining,paused,isBodyDouble}=timerState;
  const mins=Math.floor(remaining/60),secs=remaining%60;
  const display=`${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  const r=120,c=2*Math.PI*r;
  const pct=((total-remaining)/total)*100;
  const offset=c-(pct/100)*c;
  const numEl=document.getElementById('timer-display-num');if(numEl)numEl.textContent=display;
  const ringEl=document.getElementById('timer-progress-ring');if(ringEl)ringEl.setAttribute('stroke-dashoffset',offset);
  const statusEl=document.getElementById('timer-status-text');if(statusEl)statusEl.textContent=paused?'paused':remaining===0?'done':isBodyDouble?'working together':'focusing';
  // Only rebuild buttons if state changed
  const btns=document.getElementById('timer-buttons');
  if(btns){
    const pauseBtn=document.getElementById('t-pause');
    if(remaining===0&&pauseBtn){pauseBtn.remove();}
    if(pauseBtn)pauseBtn.textContent=paused?'resume':'pause';
    const stopBtn=document.getElementById('t-stop');
    if(stopBtn&&remaining===0)stopBtn.textContent='nice';
  }
}

function rouletteTask(){

  if(active.length===0){toast('no tasks to pick from');return;}
  const weighted=[];active.forEach(t=>{const w=t.urgency==='today'?5:t.urgency==='week'?3:1;for(let i=0;i<w;i++)weighted.push(t);});
  const picked=weighted[Math.floor(Math.random()*weighted.length)];
  state.view='now';render();toast(`🎲 the dice say: ${picked.title}`);
}

document.addEventListener('click',(e)=>{
  const tab=e.target.closest('.tab');
  if(tab){state.view=tab.dataset.view;render();return;}
  const chip=e.target.closest('.chip');
  if(chip){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));chip.classList.add('active');state.filter=chip.dataset.filter;render();return;}
  const action=e.target.closest('[data-action]');
  if(action){
    const a=action.dataset.action;
    if(a==='checkin'){
      const mood=action.dataset.mood;const today=new Date().toISOString().slice(0,10);
      meta.checkins.push({date:today,mood});meta.lastCheckinDate=today;
      meta.coins=(meta.coins||0)+2;saveMeta();
      toast(`logged ${mood} · +2 🪙`);renderCheckin();renderBlob();return;
    }
    if(a==='dismiss-checkin'){meta.checkinDismissedDate=new Date().toISOString().slice(0,10);saveMeta();renderCheckin();return;}
    if(a==='open-chest'){
      const chest=(meta.chests||[]).find(c=>c.id===action.dataset.chest);
      if(chest&&!chest.opened)openChest(chest);
      return;
    }
    if(a==='fusion-slot'){
      const slotIdx=parseInt(action.dataset.slot);
      const owned=Object.keys(BLOBS).filter(id=>meta.unlocked.includes(id));
      if(owned.length<2){toast('unlock at least 2 blobs first');return;}
      // Cycle through unlocked blobs
      const current=fusionSlots[slotIdx];
      const idx=current?owned.indexOf(current):-1;
      fusionSlots[slotIdx]=owned[(idx+1)%owned.length];
      render();return;
    }
    if(a==='fuse'){tryFusion();return;}
    if(a==='select-blob'){const id=action.dataset.blob;if(meta.unlocked.includes(id)){meta.currentBlob=id;saveMeta();render();toast(`equipped: ${BLOBS[id].name}`);}else toast(`locked. ${BLOBS[id].unlock-meta.totalDone} more tasks.`);return;}
    if(a==='checkin'){
      const m=action.dataset.mood;const today=new Date().toISOString().slice(0,10);
      if(!meta.checkins)meta.checkins=[];
      meta.checkins.push({date:today,mood:m,label:moods[m]});
      meta.lastCheckinDate=today;saveMeta();render();
      toast(`logged: ${m} ${moods[m]}`);
      return;
    }
    if(a==='dismiss-checkin'){
      meta.checkinDismissedDate=new Date().toISOString().slice(0,10);
      saveMeta();render();return;
    }
    if(a==='fusion-slot'){
      const slot=parseInt(action.dataset.slot);
      // pick from unlocked blobs (not already in other slot)
      const available=Object.keys(BLOBS).filter(b=>meta.unlocked.includes(b)&&b!==fusionSlots[1-slot]);
      if(available.length===0){toast('no blobs available');return;}
      const current=fusionSlots[slot];
      const idx=current?available.indexOf(current):-1;
      fusionSlots[slot]=available[(idx+1)%available.length];
      render();return;
    }
    if(a==='fuse'){tryFusion();return;}
    if(a==='open-chest'){
      const id=action.dataset.chest;
      const chest=meta.chests.find(c=>c.id===id);
      if(chest)openChest(chest);
      return;
    }
    if(a==='show-pill'){
      const p=action.dataset.pill;
      const el=document.getElementById(`${p}-pill`);
      if(el&&el.title)toast(el.title);
      return;
    }
    if(a==='travel'){const id=action.dataset.region;if(meta.unlockedRegions.includes(id)){meta.currentRegion=id;saveMeta();render();toast(`traveled to ${REGIONS[id].name}`);}else toast(`locked. need ${REGIONS[id].unlock} done.`);return;}
    if(a==='buy'){const id=action.dataset.item,item=SHOP_ITEMS[id];if(meta.coins>=item.cost){meta.coins-=item.cost;meta.ownedItems.push(id);if(item.type==='accessory')meta.equippedItems.push(id);saveMeta();render();toast(`got ${item.name}!`);}else toast(`need ${item.cost-meta.coins} more coins`);return;}
    if(a==='toggle-equip'){const id=action.dataset.item;if(meta.equippedItems.includes(id))meta.equippedItems=meta.equippedItems.filter(x=>x!==id);else meta.equippedItems.push(id);saveMeta();render();return;}
    if(a==='del-quest'){const id=action.dataset.id;if(confirm('delete this quest?')){state.quests=state.quests.filter(q=>q.id!==id);state.tasks.forEach(t=>{if(t.questId===id)t.questId=null;});save();render();}return;}
    if(a==='claim-quest'){const id=action.dataset.id;const q=state.quests.find(x=>x.id===id);if(q&&!q.claimed){q.claimed=true;meta.coins+=q.reward;saveMeta();save();celebrate();lootPopup(`🏆 quest complete! +${q.reward} 🪙`);render();}return;}
    const id=action.dataset.id,task=state.tasks.find(t=>t.id===id);
    if(a==='toggle'){const wasDone=task.done;task.done=!task.done;if(!wasDone&&task.done){const lootMsg=recordDone(task);celebrate();lootPopup(lootMsg);checkNpcReward();const el=document.querySelector(`[data-task="${id}"]`);if(el)el.classList.add('completing');}save();setTimeout(render,250);}
    else if(a==='toggle-sub'){const s=task.subtasks.find(x=>x.id===action.dataset.sub);const wasDone=s.done;s.done=!s.done;if(!wasDone&&s.done){toast('one closer ✓');if(task.subtasks.every(x=>x.done)&&!task.done){task.done=true;const lootMsg=recordDone(task);celebrate();lootPopup(lootMsg);checkNpcReward();}}save();render();}
    else if(a==='del-sub'){task.subtasks=task.subtasks.filter(x=>x.id!==action.dataset.sub);save();render();}
    else if(a==='add-sub'){const text=prompt('what tiny step?');if(text&&text.trim()){if(!task.subtasks)task.subtasks=[];task.subtasks.push({id:'s'+Date.now(),text:text.trim(),done:false});save();render();}}
    else if(a==='edit')openModal(task);
    else if(a==='delete'){if(confirm('delete this task?')){state.tasks=state.tasks.filter(t=>t.id!==id);save();render();toast('gone');}}
    else if(a==='breakdown')openBreakdown(task);
    else if(a==='timer')startTimer(task,25);
    else if(a==='timer-quick')startTimer(task,2);
    return;
  }
  const pill=e.target.closest('.pill');
  if(pill&&pill.parentElement.dataset.field){const f=pill.parentElement.dataset.field;pill.parentElement.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));pill.classList.add('active');document.getElementById('modal').dataset[f]=pill.dataset.val;return;}
  if(e.target.id==='m-cancel'||e.target.id==='modal-bg'){closeModal();return;}
  if(e.target.id==='m-save'){
    const m=document.getElementById('modal'),title=document.getElementById('m-title').value.trim();if(!title)return;
    const questSel=document.getElementById('m-quest');
    const data={title,urgency:m.dataset.urgency,context:m.dataset.context,energy:m.dataset.energy,deadline:document.getElementById('m-deadline').value||null,notes:document.getElementById('m-notes').value.trim(),questId:questSel?(questSel.value||null):null,repeat:m.dataset.repeat||'none'};
    if(editingId)Object.assign(state.tasks.find(t=>t.id===editingId),data);
    else state.tasks.push({id:uid(),done:false,subtasks:[],created:Date.now(),questId:null,...data});
    save();closeModal();render();return;
  }
  if(e.target.id==='capture-btn')addQuick();
  if(e.target.id==='roulette-btn')rouletteTask();
  if(e.target.id==='twomin-btn')startTimer(null,2);
  if(e.target.id==='bodydouble-btn')startTimer({title:'whatever you want'},25,true);
  if(e.target.id==='freeze-btn')freezeStreak();
  if(e.target.id==='notif-btn')requestNotifPermission();
  if(e.target.id==='notif-btn')requestNotifPermission();
  if(e.target.id==='export-btn')exportJSON();
  if(e.target.id==='import-btn')document.getElementById('import-file').click();
  if(e.target.id==='copy-btn')copyAsText();
});
function addQuick(){
  const inp=document.getElementById('capture-input'),title=inp.value.trim();if(!title)return;
  state.tasks.push({id:uid(),title,done:false,urgency:'week',context:'work',energy:'quick',deadline:null,notes:'',subtasks:[],created:Date.now(),questId:null});
  inp.value='';save();render();
  const captured=['noted','on it','gotcha','added','logged'];toast(captured[Math.floor(Math.random()*captured.length)]);
}
document.addEventListener('keydown',(e)=>{if(e.target.id==='capture-input'&&e.key==='Enter')addQuick();if(e.key==='Escape'){if(timerState)stopTimer();else if(editingId!==null)closeModal();}});
function exportJSON(){const blob=new Blob([JSON.stringify({tasks:state.tasks,quests:state.quests,meta},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`bloblist-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);toast('exported');}
document.getElementById('import-file').addEventListener('change',(e)=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=(ev)=>{try{const data=JSON.parse(ev.target.result);if(data.tasks){if(confirm(`import? this replaces everything.`)){state.tasks=data.tasks;state.quests=data.quests||[];if(data.meta){meta={...meta,...data.meta};saveMeta();}save();render();toast('imported');}}}catch{alert('invalid file');}};reader.readAsText(file);});
function copyAsText(){const lines=state.tasks.filter(t=>!t.done).map(t=>{const tags=[t.urgency,t.context,t.energy].filter(Boolean).join('/');const dl=t.deadline?` [due ${t.deadline}]`:'';let s=`- ${t.title} (${tags})${dl}`;if(t.subtasks&&t.subtasks.length)s+='\n'+t.subtasks.map(x=>`  - [${x.done?'x':' '}] ${x.text}`).join('\n');if(t.notes)s+=`\n  notes: ${t.notes}`;return s;}).join('\n');navigator.clipboard.writeText(lines).then(()=>toast('copied'));}
load();
</script>
